x-tenant-config: &tenant-config
  SUPERSET_CONFIG_PATH: /app/nxtbi-saas/superset_config.py
  NXTBI_SAAS_TENANT_SLUG: ${NXTBI_SAAS_TENANT_SLUG:?}
  NXTBI_SAAS_TENANT_NAME: ${NXTBI_SAAS_TENANT_NAME:?}
  NXTBI_SAAS_TENANT_GROUP: ${NXTBI_SAAS_TENANT_GROUP:?}
  NXTBI_SAAS_TENANT_VALUE: ${NXTBI_SAAS_TENANT_VALUE:?}
  NXTBI_SAAS_TENANT_SECRET: ${NXTBI_SAAS_TENANT_SECRET:?}
  NXTBI_SAAS_WAREHOUSE_URI: ${NXTBI_SAAS_WAREHOUSE_URI:?}
  NXTBI_SAAS_REDIS_URL: redis://cache:6379/0
  NXTBI_SAAS_PUBLIC_URL: ${NXTBI_SAAS_PUBLIC_URL:?}
  NXTBI_SAAS_PORTAL_URL: ${NXTBI_SAAS_PORTAL_URL:?}
  NXTBI_SAAS_OIDC_ISSUER: ${NXTBI_SAAS_OIDC_ISSUER:?}
  NXTBI_SAAS_OIDC_BACKEND: ${NXTBI_SAAS_OIDC_BACKEND:?}
  NXTBI_SAAS_OIDC_CLIENT_ID: ${NXTBI_SAAS_OIDC_CLIENT_ID:?}
  NXTBI_SAAS_OIDC_CLIENT_SECRET: ${NXTBI_SAAS_OIDC_CLIENT_SECRET:?}

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${NXTBI_SAAS_POSTGRES_PASSWORD:?}
      NXTBI_SAAS_TENANT_VALUE: ${NXTBI_SAAS_TENANT_VALUE:?}
      NXTBI_SAAS_MIGRATION_PASSWORD: ${NXTBI_SAAS_MIGRATION_PASSWORD:?}
      NXTBI_SAAS_RUNTIME_PASSWORD: ${NXTBI_SAAS_RUNTIME_PASSWORD:?}
      NXTBI_SAAS_READER_PASSWORD: ${NXTBI_SAAS_READER_PASSWORD:?}
    volumes:
      - metadata:/var/lib/postgresql/data
      - ./tenant/init-database.sh:/docker-entrypoint-initdb.d/20-nxtbi-saas.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres']
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [pilot]

  cache:
    image: redis:7-alpine
    command: [redis-server, --save, '', --appendonly, 'no']
    networks: [pilot]

  init:
    image: ${NXTBI_SAAS_SUPERSET_IMAGE:?}
    entrypoint: [/bin/sh, -ec]
    command: ["superset db upgrade && superset init && python /app/nxtbi-saas/seed.py"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *tenant-config
      NXTBI_SAAS_METADATA_URI: ${NXTBI_SAAS_MIGRATION_URI:?}
    volumes:
      - ./tenant:/app/nxtbi-saas:ro
    networks: [pilot]

  web:
    image: ${NXTBI_SAAS_SUPERSET_IMAGE:?}
    entrypoint: [gunicorn]
    command: [--workers, '1', --threads, '4', --timeout, '90', --bind, '0.0.0.0:8088', 'superset.app:create_app()']
    depends_on:
      init:
        condition: service_completed_successfully
      cache:
        condition: service_started
    ports:
      - "127.0.0.1:${NXTBI_SAAS_HTTP_PORT:?}:8088"
    environment:
      <<: *tenant-config
      NXTBI_SAAS_METADATA_URI: ${NXTBI_SAAS_RUNTIME_URI:?}
    volumes:
      - ./tenant:/app/nxtbi-saas:ro
    networks: [pilot]

networks:
  pilot:
    external: true
    name: ${NXTBI_SAAS_NETWORK:?}

volumes:
  metadata:
